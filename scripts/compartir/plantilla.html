<!doctype html>
<!-- La imagen que se ve al compartir el enlace (1200×630). La dibuja scripts/preparar-compartir.mjs. -->
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Anybody";
        src: url("../../node_modules/@fontsource-variable/anybody/files/anybody-latin-wdth-normal.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-stretch: 50% 150%;
      }

      @font-face {
        font-family: "Manrope";
        src: url("../../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2") format("woff2-variations");
        font-weight: 200 800;
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #06080f;
      }

      body {
        position: relative;
        color: #e8ecf5;
        font-family: "Manrope", sans-serif;
      }

      img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 60%;
      }

      /* Como en la portada: el nombre en el tercio de arriba, la ficha abajo a la izquierda. */
      h1 {
        position: absolute;
        top: 46px;
        left: 50%;
        transform: translateX(-50%);
        font-family: "Anybody", sans-serif;
        font-size: 262px;
        font-weight: 900;
        font-stretch: 62%;
        line-height: 0.86;
        letter-spacing: -0.015em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .ficha {
        position: absolute;
        left: 56px;
        bottom: 48px;
        display: grid;
        gap: 6px;
      }

      .ficha strong {
        font-family: "Anybody", sans-serif;
        font-size: 50px;
        font-weight: 800;
        font-stretch: 75%;
        line-height: 1;
        text-transform: uppercase;
      }

      .ficha span {
        font-size: 22px;
        font-weight: 600;
        color: #ffd6db;
      }
    </style>
  </head>
  <body>
    <img src="../../public/imagenes/puerta-2000.webp" alt="" />
    <h1>Contraluz</h1>
    <p class="ficha">
      <strong>Techno y house en Bogotá</strong>
      <span>Discoteca ficticia · proyecto de portafolio</span>
    </p>
  </body>
</html>
