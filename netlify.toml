# Configuración de Netlify para Contraluz.
# Netlify instala las dependencias, ejecuta "npm run build" y publica la carpeta dist/.
# El sitio no usa claves de API: si algún día hace falta una, vive en las variables
# de entorno de Netlify y se usa desde una función, nunca desde el navegador.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cabeceras de seguridad para todas las páginas.
[[headers]]
  for = "/*"
  [headers.values]
    # Solo se cargan recursos del propio sitio: sin CDN, sin fuentes externas, sin scripts en línea.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; media-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    # Nadie puede meter el sitio en un iframe (clickjacking).
    X-Frame-Options = "DENY"
    # El navegador no adivina tipos de archivo.
    X-Content-Type-Options = "nosniff"
    # Al salir a otro sitio solo se envía el dominio, no la ruta completa.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # El sitio no usa cámara, micrófono, ubicación ni pagos.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Siempre por HTTPS.
    Strict-Transport-Security = "max-age=31536000"

# Vite pone un hash en el nombre de cada archivo compilado (main-3f9a1c.js):
# si el archivo cambia, cambia el nombre. Por eso se pueden guardar un año sin riesgo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las fotos no llevan hash: si se regeneran con el mismo nombre, en un día ya se ve la nueva.
[[headers]]
  for = "/imagenes/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"
